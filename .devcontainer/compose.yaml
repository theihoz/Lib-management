name: lib-management-devcontainer
services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    working_dir: /workspaces/lib-management
    volumes:
      - type: bind
        source: ..
        target: /workspaces/lib-management
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: lib_dev
      DB_NAME: lib_management
      OIDC_ISSUER: http://localhost:8080/realms/lib-management
      OIDC_JWKS_URL: http://keycloak:8080/realms/lib-management/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:5173:5173"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    env_file: .env
    environment:
      POSTGRES_USER: lib_dev
      POSTGRES_DB: lib_management
    volumes:
      - devcontainer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lib_dev -d lib_management"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: [no-new-privileges:true]
  keycloak:
    # DEV ONLY: start-dev uses embedded storage, independent of the app DB.
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    command: ["start-dev", "--import-realm", "--hostname=http://localhost:8080", "--hostname-backchannel-dynamic=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run .devcontainer/prepare.py}
    volumes:
      - ./keycloak/lib-management-realm.json:/opt/keycloak/data/import/lib-management-realm.json:ro
      - devcontainer-keycloak:/opt/keycloak/data/h2
    ports:
      - "127.0.0.1:8080:8080"
    security_opt: [no-new-privileges:true]
volumes:
  devcontainer-pgdata:
  devcontainer-keycloak:
