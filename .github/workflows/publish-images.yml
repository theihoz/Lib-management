name: Publish container images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only publish the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: '[ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]'

  quality:
    needs: branch
    uses: ./.github/workflows/ci.yml
    with:
      require_app: true

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build BOTH images before any registry push
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          namespace=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          for app in api web; do
            docker build --target production -f "docker/${app}.Dockerfile" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$REVISION" \
              -t "ghcr.io/${namespace}/lib-management-${app}:sha-${REVISION}" .
          done
          echo "NAMESPACE=$namespace" >> "$GITHUB_ENV"
      - name: Login using the scoped workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish images and record digests
        env:
          REVISION: ${{ github.sha }}
        run: |
          for app in api web; do
            image="ghcr.io/${NAMESPACE}/lib-management-${app}:sha-${REVISION}"
            docker push "$image"
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            printf '%s\n' "- $digest" >> "$GITHUB_STEP_SUMMARY"
          done
          echo 'Images published. No server deployment was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Logout
        if: always()
        run: docker logout ghcr.io
