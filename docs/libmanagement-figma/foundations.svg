ocus</text><text x="84" y="1522" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Chỉ đổi màu hoặc phản hồi trạng thái</text><rect x="1220" y="1460" width="1100" height="180" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="1244" y="1496" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">180ms / dòng vừa quét</text><text x="1244" y="1522" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Fade + y4px; không lấy focus scanner</text><rect x="2380" y="1460" width="1100" height="180" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="2404" y="1496" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">240ms / drawer, dialog</text><text x="2404" y="1522" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Scale .98 → 1; focus trap và return focus</text><rect x="60" y="1680" width="1100" height="180" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="84" y="1716" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">280ms / portal route</text><text x="84" y="1742" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Fade + y8px; shell giữ nguyên</text><rect x="1220" y="1680" width="1100" height="180" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="1244" y="1716" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">Reduced motion</text><text x="1244" y="1742" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Bỏ translate / scale / stagger; giữ chữ và icon</text><rect x="2380" y="1680" width="1100" height="180" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="2404" y="1716" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">Polling &amp; pending</text><text x="2404" y="1742" font-family="Arial" font-size="13" font-weight="400" fill="#53616B">Không replay hiệu ứng; không giả phần trăm</text><text x="60" y="2030" font-family="Georgia" font-size="36" font-weight="700" fill="#17212B">Bộ trạng thái dùng chung</text><rect x="60" y="2100" width="197" height="28" rx="6" fill="#EAF0F5"/><text x="70" y="2119" font-family="Arial" font-size="12" font-weight="700" fill="#174B73">Đang tải · giữ kích thước</text><rect x="1220" y="2100" width="246" height="28" rx="6" fill="#EAF0F5"/><text x="1230" y="2119" font-family="Arial" font-size="12" font-weight="700" fill="#174B73">Chưa có dữ liệu · hành động tiếp</text><rect x="2380" y="2100" width="204" height="28" rx="6" fill="#FCEDEA"/><text x="2390" y="2119" font-family="Arial" font-size="12" font-weight="700" fill="#B42318">Lỗi · thử lại tại vùng lỗi</text><rect x="60" y="2200" width="246" height="28" rx="6" fill="#FFF1DC"/><text x="70" y="2219" font-family="Arial" font-size="12" font-weight="700" fill="#8A4B08">Đang gửi · khóa action liên quan</text><rect x="1220" y="2200" width="239" height="28" rx="6" fill="#E8F3ED"/><text x="1230" y="2219" font-family="Arial" font-size="12" font-weight="700" fill="#146C43">Thành công · biên nhận bền vững</text><rect x="2380" y="2200" width="204" height="28" rx="6" fill="#FFF1DC"/><text x="2390" y="2219" font-family="Arial" font-size="12" font-weight="700" fill="#8A4B08">409 · giữ nội dung đã nhập</text></svg>