<svg xmlns="http://www.w3.org/2000/svg" width="2620" height="2040" viewBox="0 0 2620 2040"><rect x="0" y="0" width="2620" height="2040" rx="0" fill="#E6E9E4"/><text x="20" y="55" font-family="Georgia" font-size="28" font-weight="700" fill="#142C35">LIB / Xác thực — Mobile 390</text><text x="20" y="118" font-family="Arial" font-size="14" font-weight="700" fill="#142C35">FE01.01 / Đăng nhập thư viện</text><g id="M-FE01.01" transform="translate(20 140)"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F7F5EF"/><rect x="0" y="0" width="390" height="72" rx="0" fill="#FFFFFF"/><text x="20" y="43" font-family="Arial" font-size="18" font-weight="700" fill="#174B73">LIB / THƯ VIỆN</text><text x="337" y="43" font-family="Arial" font-size="24" font-weight="400" fill="#174B73">≡</text><text x="20" y="106" font-family="Arial" font-size="21" font-weight="400" fill="#17212B">Đăng nhập thư viện</text><rect x="0" y="780" width="390" height="64" rx="0" fill="#FFFFFF"/><text x="25" y="817" font-family="Arial" font-size="13" font-weight="700" fill="#174B73">Tác nghiệp</text><text x="150" y="817" font-family="Arial" font-size="13" font-weight="400" fill="#174B73">Độc giả</text><text x="270" y="817" font-family="Arial" font-size="13" font-weight="400" fill="#174B73">Danh mục</text><rect x="20" y="230" width="350" height="370" rx="12" fill="#FFFFFF" stroke="#D8DCD8"/><text x="44" y="266" font-family="Georgia" font-size="20" font-weight="700" fill="#17212B">Thư viện của bạn</text><text x="40" y="310" font-family="Arial" font-size="16" font-weight="400" fill="#53616B">Sử dụng tài khoản được nhân viên</text><text x="40" y="333" font-family="Arial" font-size="16" font-weight="400" fill="#53616B">cấp hoặc liên kết.</text><rect x="40" y="460" width="310" height="44" rx="8" fill="#174B73"/><text x="56" y="488" font-family="Arial" font-size="14" font-weight="700" fill="#FFFFFF">Tiếp tục với SSO</text></g><text x="450" y="118" font-family="Arial" font-size="14" font-weight="700" fill="#142