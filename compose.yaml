name: lib-management

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lib_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lib_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks: [backend]

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    init: true
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lib_dev}
      DB_NAME: ${POSTGRES_DB:-lib_management}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api:/app
      - api_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, frontend]

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: dev
    init: true
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web:/app
      - web_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [frontend]

volumes:
  pgdata:
  api_modules:
  web_modules:

networks:
  backend:
  frontend:
