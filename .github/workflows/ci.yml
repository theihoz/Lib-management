name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  # Distinct from the caller's publish group: a reused workflow must not cancel its caller.
  group: python-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require backend source and lockfile
        run: |
          for file in apps/api/pyproject.toml apps/api/uv.lock apps/api/src/lib_management/main.py .python-version; do
            test -s "$file" || { echo "Required backend file missing or empty: $file"; exit 1; }
          done
      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
  quality:
    needs: configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: ci_fixture
          POSTGRES_DB: ci_fixture
          POSTGRES_PASSWORD: ci-disposable-fixture
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ci_fixture -d ci_fixture"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7.1.0
        with:
          version: "0.12.21"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - name: Unit tests independent of database
        run: uv run --locked pytest --ignore=tests/test_db_integration.py
      - name: PostgreSQL integration tests
        env:
          RUN_DB_INTEGRATION: "1"
          DB_HOST: 127.0.0.1
          DB_PORT: "5432"
          DB_USER: ci_fixture
          DB_NAME: ci_fixture
          DB_PASSWORD: ci-disposable-fixture
        run: uv run --locked pytest tests/test_db_integration.py
      - run: uv build --wheel
  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build production image without publishing
        run: docker build --target production -f docker/api.Dockerfile -t lib-management-api:ci .
  ci-result:
    if: always()
    needs: [configuration, quality, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required check result
        env:
          CONFIGURATION: ${{ needs.configuration.result }}
          QUALITY: ${{ needs.quality.result }}
          CONTAINER: ${{ needs.container.result }}
        run: |
          for result in "$CONFIGURATION" "$QUALITY" "$CONTAINER"; do
            if [ "$result" != success ]; then
              echo "Required CI job did not succeed: $result"
              exit 1
            fi
          done
