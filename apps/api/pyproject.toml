[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[project]
name = "lib-management-api"
version = "0.1.0"
description = "Library management API infrastructure"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
[dependency-groups]
dev = [
    "ruff>=0.11",
    "mypy>=1.15",
    "pytest>=8",
    "httpx>=0.28",
    "build>=1.2",
    "httpx2>=2.13.1",
]
[tool.hatch.build.targets.wheel]
packages = ["src/lib_management"]
[tool.ruff]
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
testpaths = ["tests"]
