<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="720" viewBox="0 0 1800 720"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#254c48"/></marker></defs><rect width="1800" height="720" fill="white"/><rect x="80" y="25" width="200" height="55" rx="8" fill="#f6f2e9" stroke="#254c48"/><text x="180" y="60" text-anchor="middle" font-family="Arial" font-size="22">Thủ thư</text><path d="M180 80 V650" stroke="#999" stroke-dasharray="8 6"/><rect x="540" y="25" width="200" height="55" rx="8" fill="#f6f2e9" stroke="#254c48"/><text x="640" y="60" text-anchor="middle" font-family="Arial" font-size="22">FastAPI</text><path d="M640 80 V650" stroke="#999" stroke-dasharray="8 6"/><rect x="1020" y="25" width="200" height="55" rx="8" fill="#f6f2e9" stroke="#254c48"/><text x="1120" y="60" text-anchor="middle" font-family="Arial" font-size="22">PostgreSQL</text><path d="M1120 80 V650" stroke="#999" stroke-dasharray="8 6"/><rect x="1510" y="25" width="200" height="55" rx="8" fill="#f6f2e9" stroke="#254c48"/><text x="1610" y="60" text-anchor="middle" font-family="Arial" font-size="22">Quản lý</text><path d="M1610 80 V650" stroke="#999" stroke-dasharray="8 6"/><path d="M180 135 H640" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="410.0" y="123" text-anchor="middle" font-family="Arial" font-size="18">1. Nhận trả DAMAGE / ghi mất LOST + đề xuất phí</text><path d="M640 200 H1120" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="880.0" y="188" text-anchor="middle" font-family="Arial" font-size="18">2. Transaction: khóa Reader/copy/item; đóng LoanItem; tạo PENDING</text><path d="M1120 265 H640" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="880.0" y="253" text-anchor="middle" font-family="Arial" font-size="18">3. Commit biên nhận trả và assessment</text><path d="M640 330 H180" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="410.0" y="318" text-anchor="middle" font-family="Arial" font-size="18">4. Hiển thị nhận trả thành công, phí chờ duyệt</text><path d="M1610 395 H640" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="1125.0" y="383" text-anchor="middle" font-family="Arial" font-size="18">5. Quyết định amount / reason / expectedVersion</text><path d="M640 460 H1120" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="880.0" y="448" text-anchor="middle" font-family="Arial" font-size="18">6. Transaction: khóa Reader/assessment; tạo charge nếu amount > 0</text><path d="M1120 525 H640" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="880.0" y="513" text-anchor="middle" font-family="Arial" font-size="18">7. Commit ASSESSED hoặc CLOSED_NO_CHARGE; audit</text><path d="M640 590 H1610" stroke="#254c48" stroke-width="2" marker-end="url(#a)"/><text x="1125.0" y="578" text-anchor="middle" font-family="Arial" font-size="18">8. Trả quyết định và dư nợ mới</text><text x="900" y="700" text-anchor="middle" font-family="Arial" font-size="20">PENDING không chặn trả; quyết định amount=0 không tạo FineCharge.</text></svg>