name: Publish API image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Only publish the default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: '[ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]'

  quality:
    needs: branch
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: image-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build API before registry login
        env:
          OWNER: ${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          namespace=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${namespace}/lib-management-api:sha-${REVISION}"
          docker build --target production -f docker/api.Dockerfile \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$image" .
          echo "API_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Login using the scoped workflow token
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Publish API and record digest
        run: |
          docker push "$API_IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$API_IMAGE")
          test -n "$digest"
          printf '%s\n' "- Image: $API_IMAGE" "- RepoDigest: $digest" >> "$GITHUB_STEP_SUMMARY"
          echo 'API image published. No server deployment was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Logout
        if: always()
        run: docker logout ghcr.io
