name: lib-management

services:
  db:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    # database-design.md: timestamptz stored in UTC; business time zone is applied in code.
    command: ["postgres", "-c", "timezone=UTC", "-c", "log_timezone=UTC"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lib_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lib_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]
    networks: [backend]

  migrate:
    # One-shot schema upgrade before api/worker; never run per replica.
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    init: true
    command: ["python", "-m", "lib_management.cli", "migrate"]
    environment: &db-env
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-lib_dev}
      DB_NAME: ${POSTGRES_DB:-lib_management}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./apps/api/src:/app/src
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    init: true
    environment:
      <<: *db-env
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      ARTIFACT_STORAGE_ROOT: /var/lib/lib-management/artifacts
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - artifacts:/var/lib/lib-management/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2.5)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [backend]

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: dev
    init: true
    command: ["python", "-m", "lib_management.worker"]
    environment:
      <<: *db-env
      ARTIFACT_STORAGE_ROOT: /var/lib/lib-management/artifacts
    volumes:
      - ./apps/api/src:/app/src
      - artifacts:/var/lib/lib-management/artifacts
    depends_on:
      migrate:
        condition: service_completed_successfully
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    networks: [backend]

volumes:
  pgdata:
  # Private report/CSV artifacts shared by api (reads) and worker (writes).
  artifacts:

networks:
  backend:
