worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker embedded DNS, with re-resolution after a replica is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream api_replicas {
        zone api_replicas 64k;
        least_conn;
        server api-1:8000 resolve max_fails=2 fail_timeout=10s;
        server api-2:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;

        location = /status {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/((api|health)(/|$)|openapi\.json$) {
            proxy_pass http://api_replicas;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            # Keep non-idempotent retries disabled. Never cache business data.
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            # The API compresses large responses; avoid duplicate compression.
            gzip off;
        }

        # Vite emits content hashes. Only these immutable files may use a CDN.
        # Missing files return a real 404, without a long-lived cache header.
        location ~* "^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|woff2?|avif|webp|png|jpe?g|svg|gif)$" {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
        }

        location = /config.json {
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
